name: Update moshi-hook

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: moshi-hook-update
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release metadata
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      version: ${{ steps.resolve.outputs.version }}
      raw_sha256: ${{ steps.resolve.outputs.raw_sha256 }}
      sri_hash: ${{ steps.resolve.outputs.sri_hash }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify the official release
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          readonly latest_url='https://cdn.getmoshi.app/hook/latest/version.txt'
          readonly archive_name='moshi-hook_Linux_x86_64.tar.gz'
          readonly version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          temp_dir="$(mktemp -d "${RUNNER_TEMP:?}/moshi-hook-resolve.XXXXXX")"
          trap 'rm -rf "$temp_dir"' EXIT

          mapfile -t current_versions < <(
            sed -nE 's/^  version = "([0-9]+)\.([0-9]+)\.([0-9]+)";$/\1.\2.\3/p' version.nix
          )
          if [[ ${#current_versions[@]} -ne 1 ]]; then
            printf 'version.nix must contain exactly one strict version assignment.\n' >&2
            exit 1
          fi
          current_version="${current_versions[0]}"
          if [[ ! "$current_version" =~ $version_pattern ]]; then
            printf 'Invalid current version.\n' >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
            --output "$temp_dir/latest-version.txt" "$latest_url"
          release_version="$(tr -d '\r\n' < "$temp_dir/latest-version.txt")"
          if [[ ! "$release_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Unexpected Moshi version: %s\n' "$release_version" >&2
            exit 1
          fi
          candidate_version="${release_version#v}"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
            --output "$temp_dir/checksums.txt" \
            "https://cdn.getmoshi.app/hook/${release_version}/checksums.txt"
          expected_sha256="$(awk -v archive="$archive_name" '
            $2 == archive && $1 ~ /^[0-9a-f]{64}$/ { count += 1; hash = $1 }
            END { if (count == 1) print hash; else exit 1 }
          ' "$temp_dir/checksums.txt")"
          if [[ ! "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Unexpected archive checksum.\n' >&2
            exit 1
          fi

          archive_file="$temp_dir/$archive_name"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
            --output "$archive_file" \
            "https://cdn.getmoshi.app/hook/${release_version}/${archive_name}"
          printf '%s  %s\n' "$expected_sha256" "$archive_file" | sha256sum --check --status -
          sri_hash="sha256-$(printf '%s' "$expected_sha256" | xxd -r -p | base64 --wrap=0)"

          version_less() {
            python3 - "$1" "$2" <<'PY'
          import sys

          try:
              left = tuple(map(int, sys.argv[1].split(".")))
              right = tuple(map(int, sys.argv[2].split(".")))
          except ValueError:
              raise SystemExit(2)
          raise SystemExit(0 if left < right else 1)
          PY
          }

          if version_less "$candidate_version" "$current_version"; then
            printf 'Refusing downgrade from %s to %s.\n' "$current_version" "$candidate_version" >&2
            exit 1
          elif [[ $? -ne 1 ]]; then
            printf 'Unable to compare Moshi versions.\n' >&2
            exit 1
          fi

          base_sha="$(git rev-parse HEAD)"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$sri_hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            printf 'Invalid resolved output.\n' >&2
            exit 1
          fi
          changed=false
          if [[ "$candidate_version" != "$current_version" ]]; then
            changed=true
          fi

          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'version=%s\n' "$candidate_version"
            printf 'raw_sha256=%s\n' "$expected_sha256"
            printf 'sri_hash=%s\n' "$sri_hash"
            printf 'changed=%s\n' "$changed"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release binary
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the resolved revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          # This job executes an unvetted upstream binary; keep GITHUB_TOKEN off the runner.
          github-token: ""
          source-tag: v3.22.2

      - name: Build and execute the independently verified package
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RAW_SHA256: ${{ needs.resolve.outputs.raw_sha256 }}
          SRI_HASH: ${{ needs.resolve.outputs.sri_hash }}
        shell: bash
        run: |
          set -euo pipefail

          readonly version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$VERSION" =~ $version_pattern ||
                ! "$RAW_SHA256" =~ ^[0-9a-f]{64}$ ||
                ! "$SRI_HASH" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            printf 'Invalid resolve output.\n' >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git checkout --detach "$BASE_SHA"
          printf '{\n  version = "%s";\n  hash = "%s";\n}\n' "$VERSION" "$SRI_HASH" > version.nix

          ./scripts/smoke-test.sh "$VERSION"

  commit:
    name: Commit validated release
    needs: [resolve, validate]
    if: needs.resolve.outputs.changed == 'true' && needs.validate.result == 'success'
    permissions:
      # Required only for the final authenticated push step.
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reverify metadata and prepare the commit
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RAW_SHA256: ${{ needs.resolve.outputs.raw_sha256 }}
          SRI_HASH: ${{ needs.resolve.outputs.sri_hash }}
        shell: bash
        run: |
          set -euo pipefail

          readonly version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$VERSION" =~ $version_pattern ||
                ! "$RAW_SHA256" =~ ^[0-9a-f]{64}$ ||
                ! "$SRI_HASH" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            printf 'Invalid resolve output.\n' >&2
            exit 1
          fi

          work_dir="$(mktemp -d "${RUNNER_TEMP:?}/moshi-hook-commit.XXXXXX")"
          git clone --no-checkout --filter=blob:none \
            'https://github.com/takeaship/moshi-hook-nix.git' "$work_dir"
          current_main="$(git -C "$work_dir" rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            printf 'main changed after resolution; refusing to commit.\n' >&2
            exit 1
          fi
          git -C "$work_dir" cat-file -e "$BASE_SHA^{commit}"
          git -C "$work_dir" checkout --detach "$BASE_SHA"
          cd "$work_dir"
          printf 'MOSHI_HOOK_COMMIT_WORKTREE=%s\n' "$work_dir" >> "$GITHUB_ENV"

          readonly archive_name='moshi-hook_Linux_x86_64.tar.gz'
          readonly release_version="v$VERSION"
          temp_dir="$(mktemp -d "${RUNNER_TEMP:?}/moshi-hook-release.XXXXXX")"
          trap 'rm -rf "$temp_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
            --output "$temp_dir/latest-version.txt" \
            'https://cdn.getmoshi.app/hook/latest/version.txt'
          latest_version="$(tr -d '\r\n' < "$temp_dir/latest-version.txt")"
          if [[ "$latest_version" != "$release_version" ]]; then
            printf 'Latest version changed after resolution.\n' >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
            --output "$temp_dir/checksums.txt" \
            "https://cdn.getmoshi.app/hook/${release_version}/checksums.txt"
          expected_sha256="$(awk -v archive="$archive_name" '
            $2 == archive && $1 ~ /^[0-9a-f]{64}$/ { count += 1; hash = $1 }
            END { if (count == 1) print hash; else exit 1 }
          ' "$temp_dir/checksums.txt")"
          if [[ "$expected_sha256" != "$RAW_SHA256" ]]; then
            printf 'Official checksum changed after resolution.\n' >&2
            exit 1
          fi

          archive_file="$temp_dir/$archive_name"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
            --output "$archive_file" \
            "https://cdn.getmoshi.app/hook/${release_version}/${archive_name}"
          printf '%s  %s\n' "$RAW_SHA256" "$archive_file" | sha256sum --check --status -
          recomputed_sri="sha256-$(printf '%s' "$RAW_SHA256" | xxd -r -p | base64 --wrap=0)"
          if [[ "$recomputed_sri" != "$SRI_HASH" ]]; then
            printf 'Resolved SRI hash does not match the archive checksum.\n' >&2
            exit 1
          fi

          mapfile -t current_versions < <(
            sed -nE 's/^  version = "([0-9]+)\.([0-9]+)\.([0-9]+)";$/\1.\2.\3/p' version.nix
          )
          if [[ ${#current_versions[@]} -ne 1 ]]; then
            printf 'version.nix must contain exactly one strict version assignment.\n' >&2
            exit 1
          fi
          current_version="${current_versions[0]}"
          if [[ ! "$current_version" =~ $version_pattern ]]; then
            printf 'Invalid current version.\n' >&2
            exit 1
          fi
          version_less() {
            python3 - "$1" "$2" <<'PY'
          import sys

          try:
              left = tuple(map(int, sys.argv[1].split(".")))
              right = tuple(map(int, sys.argv[2].split(".")))
          except ValueError:
              raise SystemExit(2)
          raise SystemExit(0 if left < right else 1)
          PY
          }
          if version_less "$VERSION" "$current_version"; then
            printf 'Refusing downgrade from %s to %s.\n' "$current_version" "$VERSION" >&2
            exit 1
          elif [[ $? -ne 1 ]]; then
            printf 'Unable to compare Moshi versions.\n' >&2
            exit 1
          fi

          printf '{\n  version = "%s";\n  hash = "%s";\n}\n' "$VERSION" "$SRI_HASH" > version.nix
          git diff --check
          git add -- version.nix
          if git diff --cached --quiet; then
            printf 'moshi-hook is already current.\n'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update moshi-hook to $VERSION"

      - name: Push the prepared commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$MOSHI_HOOK_COMMIT_WORKTREE"
          git -c "credential.helper=!f() { printf '%s\\n' 'username=x-access-token' \"password=\$GH_TOKEN\"; }; f" \
            push origin HEAD:main
